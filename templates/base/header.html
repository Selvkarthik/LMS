{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>LMS Portal</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <style>

        * {

            font-family: 'Poppins', sans-serif;

        }

        body {

            background:
                linear-gradient(
                    135deg,
                    #eef2ff,
                    #f8fafc
                );

            min-height: 100vh;

        }

        .navbar {

            background:
                linear-gradient(
                    90deg,
                    #0f172a,
                    #1e293b
                );

            padding: 16px 0;

            box-shadow:
                0 4px 20px rgba(0,0,0,0.08);

        }

        .navbar-brand {

            font-size: 28px;
            font-weight: 700;
            color: white !important;

        }

        .nav-link {

            color: rgba(255,255,255,0.85) !important;

            margin-left: 14px;

            transition: 0.3s;

            font-weight: 500;

        }

        .nav-link:hover {

            color: white !important;

            transform: translateY(-1px);

        }

        .role-badge {

            background: white;

            color: #0f172a;

            border-radius: 999px;

            padding: 8px 16px;

            font-weight: 600;

            font-size: 14px;

        }

        .main-card {

            border: 1px solid rgba(255,255,255,0.15);

            backdrop-filter: blur(18px);

            background: rgba(255,255,255,0.88);

            border-radius: 28px;

            box-shadow:
                0 10px 30px rgba(0,0,0,0.08);

            transition: 0.3s;

            animation: fadeUp 0.5s ease;

        }

        .main-card:hover {

            transform: translateY(-6px);

            box-shadow:
                0 20px 40px rgba(0,0,0,0.12);

        }

        .gradient-btn {

            background:
                linear-gradient(
                    90deg,
                    #2563eb,
                    #3b82f6
                );

            border: none;

            color: white;

            border-radius: 14px;

            padding: 12px 24px;

            font-weight: 600;

            transition: 0.3s;

            text-decoration: none;

            display: inline-block;

        }

        .gradient-btn:hover {

            transform: translateY(-2px);

            color: white;

            box-shadow:
                0 8px 20px rgba(37,99,235,0.3);

        }

        .secondary-btn {

            background: #e2e8f0;

            border: none;

            color: #0f172a;

            border-radius: 14px;

            padding: 12px 24px;

            font-weight: 600;

            transition: 0.3s;

            text-decoration: none;

            display: inline-block;

        }

        .secondary-btn:hover {

            background: #cbd5e1;

            transform: translateY(-2px);

        }

        .page-title {

            font-size: 42px;

            font-weight: 700;

            color: #0f172a;

        }

        .page-subtitle {

            color: #64748b;

            font-size: 16px;

        }

        .form-control,
        .form-select {

            border-radius: 16px !important;

            padding: 14px;

            border: 1px solid #dbeafe;

        }

        .form-control:focus,
        .form-select:focus {

            border-color: #2563eb;

            box-shadow:
                0 0 0 0.2rem rgba(37,99,235,0.15);

        }

        .badge {

            border-radius: 12px;

            font-weight: 600;

        }

        footer {

            margin-top: 60px;

        }

        @keyframes fadeUp {

            from {

                opacity: 0;

                transform: translateY(20px);

            }

            to {

                opacity: 1;

                transform: translateY(0);

            }

        }

        @media(max-width:768px) {

            .page-title {

                font-size: 32px;

            }

            .navbar-brand {

                font-size: 22px;

            }

        }

    </style>

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark">

    <div class="container">

        <a class="navbar-brand"
           href="/">

           LMS Portal

        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse"
             id="navbarNav">

            <ul class="navbar-nav ms-auto align-items-center">

                {% if user.is_authenticated %}

                    <li class="nav-item">

                        <a class="nav-link"
                           href="{% url 'courses' %}">

                           Courses

                        </a>

                    </li>

                    <li class="nav-item">

                        <span class="nav-link">

                            {{ user.username }}

                        </span>

                    </li>

                    <li class="nav-item ms-2">

                        <span class="role-badge">

                            {{ user.role|title }}

                        </span>

                    </li>

                    <li class="nav-item">

                        <a class="nav-link"
                           href="{% url 'logout' %}">

                           Logout

                        </a>

                    </li>

                {% else %}

                    <li class="nav-item">

                        <a class="nav-link"
                           href="{% url 'login' %}">

                           Login

                        </a>

                    </li>

                    <li class="nav-item">

                        <a class="nav-link"
                           href="{% url 'register' %}">

                           Register

                        </a>

                    </li>

                {% endif %}

            </ul>

        </div>

    </div>

</nav>
