{% include 'base/header.html' %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-lg-7">

            <div class="main-card p-5">

                <div class="mb-4">

                    <h1 class="page-title">

                        Add Video

                    </h1>

                    <p class="page-subtitle">

                        Upload protected learning content to
                        {{ course.title }}

                    </p>

                </div>

                <form method="post">

                    {% csrf_token %}

                    <div class="mb-4">

                        <label class="form-label fw-semibold">

                            Video Title

                        </label>

                        <input type="text"
                               name="title"
                               class="form-control form-control-lg rounded-4"
                               placeholder="Enter video title">

                    </div>

                    <div class="mb-4">

                        <label class="form-label fw-semibold">

                            YouTube Video ID

                        </label>

                        <input type="text"
                               name="youtube_link"
                               class="form-control form-control-lg rounded-4"
                               placeholder="Example: uQrJ0TkZlc">

                        <small class="text-muted">

                            Paste only the YouTube video ID.

                        </small>

                    </div>

                    <button class="gradient-btn">

                        Add Video

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% include 'base/footer.html' %}
