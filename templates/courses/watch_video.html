{% include 'base/header.html' %}

<div class="container mt-5">

    <div class="main-card p-5">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <div>

                <h1 class="fw-bold">

                    {{ video.title }}

                </h1>

                <p class="text-muted mb-0">

                    Added by:
                    {{ video.added_by.username }}

                </p>

            </div>

            <span class="badge bg-danger p-3">

                Protected Content

            </span>

        </div>

        <div class="position-relative overflow-hidden rounded-4">

            <!-- OVERLAY -->

            <div
                style="
                    position:absolute;
                    inset:0;
                    z-index:10;
                    pointer-events:none;
                    overflow:hidden;
                "
            >

                <div
                    style="
                        position:absolute;
                        inset:0;
                        background:rgba(0,0,0,0.12);
                    "
                ></div>

                <div
                    id="watermark"
                    style="
                        position:absolute;
                        top:20%;
                        left:10%;
                        opacity:0.25;
                        font-size:32px;
                        font-weight:bold;
                        color:white;
                        transform:rotate(-20deg);
                        transition:all 5s linear;
                    "
                >

                    {{ user.username }}

                </div>

            </div>

            <!-- VIDEO -->

            <div class="ratio ratio-16x9">

                <iframe
                    src="https://www.youtube.com/embed/{{ video.youtube_link }}?rel=0&modestbranding=1"
                    title="YouTube video player"
                    frameborder="0"
                    allow="
                        accelerometer;
                        autoplay;
                        clipboard-write;
                        encrypted-media;
                        gyroscope;
                        picture-in-picture;
                        web-share
                    "
                    referrerpolicy="strict-origin-when-cross-origin"
                    allowfullscreen>

                </iframe>

            </div>

        </div>

    </div>

</div>

{% include 'base/footer.html' %}
