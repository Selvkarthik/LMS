{% include 'base/header.html' %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-lg-6">

            <div class="main-card p-5">

                <div class="text-center mb-4">

                    <h1 class="page-title">
                        Create Account
                    </h1>

                    <p class="page-subtitle">

                        Join the secure LMS platform

                    </p>

                </div>

                <form method="post">

                    {% csrf_token %}

                    <div class="mb-3">

                        <label class="form-label fw-semibold">

                            Username

                        </label>

                        <input type="text"
                               name="username"
                               class="form-control form-control-lg rounded-4">

                    </div>

                    <div class="mb-3">

                        <label class="form-label fw-semibold">

                            Email

                        </label>

                        <input type="email"
                               name="email"
                               class="form-control form-control-lg rounded-4">

                    </div>

                    <div class="mb-3">

                        <label class="form-label fw-semibold">

                            Mobile

                        </label>

                        <input type="text"
                               name="mobile"
                               class="form-control form-control-lg rounded-4">

                    </div>

                    <div class="mb-3">

                        <label class="form-label fw-semibold">

                            Role

                        </label>

                        <select name="role"
                                class="form-select form-select-lg rounded-4">

                            <option value="student">
                                Student
                            </option>

                            <option value="trainer">
                                Trainer
                            </option>

                        </select>

                    </div>

                    <div class="mb-4">

                        <label class="form-label fw-semibold">

                            Password

                        </label>

                        <input type="password"
                               name="password"
                               class="form-control form-control-lg rounded-4">

                    </div>

                    <button class="gradient-btn w-100">

                        Register

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% include 'base/footer.html' %}
